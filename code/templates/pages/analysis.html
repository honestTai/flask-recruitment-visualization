<!-- Setting Toast by sweetalert -->
<script>
    const Toast = Swal.mixin({
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 3000,
        timerProgressBar: true,
        didOpen: (toast) => {
            toast.addEventListener('mouseenter', Swal.stopTimer)
            toast.addEventListener('mouseleave', Swal.resumeTimer)
        }
    });
</script>


<!-- Chart loader -->
<script>
    ;(() => {
        var timerInterval = 0;
        let saveType = localStorage.getItem('datasource');
        let saveChartype = localStorage.getItem('chartype');

        const datasource = document.getElementById('data-source');
        const chartype = document.getElementById('chart-type');
        let dataname = localStorage.getItem('dataname') == null ? '51job' : localStorage.getItem('dataname');

        if (saveType) {
            datasource.value = saveType;
        } else {
            datasource.value = 'csv';
            saveType = 'csv';
        }

        if (saveChartype) {
            chartype.value = saveChartype;
        } else {
            chartype.value = 'matplotlib';
            saveChartype = 'matplotlib';
        }

        datasource.addEventListener('change', function () {
            localStorage.setItem('datasource', datasource.value);
            window.location.reload();
        });

        chartype.addEventListener('change', function () {
            localStorage.setItem('chartype', chartype.value);
            window.location.reload();
        });

        const paramsString = window.location.search
        const params = new URLSearchParams(paramsString);
        const keyword = params.get('keyword') == null ? '' : params.get('keyword');

        const fetchData = async () => {
            try {
                const url = `/api/analysis?keyword=${keyword}&name=${dataname}&type=${saveType}&chartype=${saveChartype}`;
                const response = await fetch(url, {
                    method: 'GET',
                });
                return await response.json();
            } catch (error) {
                Toast.fire({
                    icon: 'error',
                    title: '网络错误，请稍后重试',
                });
            }
        };

        Swal.fire({
            title: "正在绘图中，请稍等",
            html: "已经渲染<b></b>秒.",
            timerProgressBar: true,
            didOpen: () => {
                Swal.showLoading();
                const timer = Swal.getPopup().querySelector("b");
                clearInterval(timerInterval);
                let Interval = 0;
                timerInterval = setInterval(() => {
                    Interval++;
                    timer.textContent = Interval;
                }, 1000);
            },
            willClose: () => {
                timerInterval = 0;
                clearInterval(timerInterval);
            }
        });

        fetchData().then(result => {

            if (result.status === 0) {
                Toast.fire({
                    icon: 'error',
                    title: result.message,
                });
                return;
            }

            if (result.status === 1) {
                Swal.close();
                clearInterval(timerInterval);
                Toast.fire({
                    icon: 'success',
                    title: '加载完成'
                });
                const items = result.data;
                const content = document.getElementById('main-content');
                for (const key in items) {
                    if (items.hasOwnProperty(key)) {
                        const item = items[key];

                        const chart = document.createElement('div');
                        chart.className = 'col-md-6';
                        chart.innerHTML = `<div class="card m-2">
                                                <div class="card-header">
                                                    <h6 class="mb-0 ">${item.title}</h6>
                                                </div>
                                                <div class="card-body p-0 d-flex justify-content-center align-content-center">
                                                    <img class="w-95" src="${item.data}">
                                                </div>
                                                <div class="card-footer pt-0">
                                                    <hr class="dark horizontal">
                                                    <div class="d-flex ">
                                                        <i class="material-icons text-sm my-auto me-1">verified</i>
                                                        <p class="mb-0 text-sm">${item.issue}</p>
                                                    </div>
                                                </div>
                                            </div>`;
                        content.appendChild(chart);
                    }
                }
            }
        });
    })();
</script>

<!-- Keyword earch -->
<script>
    ;(() => {
        document.getElementById('search').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const search = document.getElementById('search');
                const keyword = search.value;
                let url = new URL(window.location.href);
                let params = url.searchParams;
                params.set('keyword', keyword);
                window.location.href = url.toString();
            }
        });
    })();
</script>

<!-- Logout request -->
<script>
    const logout = () => {
        fetch('/api/logout', {
            method: 'POST',
        }).then(response => response.json())
            .then(data => {
                if (data.status === 1) {
                    Toast.fire({
                        icon: 'success',
                        title: data.message
                    });
                    window.location.href = window.location.origin;
                }
            }).catch(error => {
            Toast.fire({
                icon: 'error',
                title: '网络错误，请稍后重试'
            });
        });
    }
</script>
