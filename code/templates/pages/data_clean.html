<!-- Setting Toast by sweetalert -->
<script>
    const Toast = Swal.mixin({
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 3000,
        timerProgressBar: true,
        didOpen: (toast) => {
            toast.addEventListener('mouseenter', Swal.stopTimer)
            toast.addEventListener('mouseleave', Swal.resumeTimer)
        }
    });
</script>

<!-- Data counter -->
<script>
    ;(() => {
        let type = localStorage.getItem('datasource');
        let dataname = localStorage.getItem('dataname') == null ? '51job' : localStorage.getItem('dataname');
        const datasource = document.getElementById('data-source');

        if (type) {
            datasource.value = type;
        } else {
            datasource.value = 'csv';
            type = 'csv';
        }

        datasource.addEventListener('change', function () {
            localStorage.setItem('datasource', datasource.value);
            window.location.reload();
        });


        const fetchData = async () => {
            try {
                const url = `/api/clean?name=${dataname}&type=${type}`;
                const response = await fetch(url, {
                    method: 'GET',
                });
                const result = await response.json();
                if (result.status === 1) {
                    return result.data;
                }

                if (result.status === 0) {
                    Toast.fire({
                        icon: 'error',
                        title: result.message,
                    });
                }
            } catch (error) {
                Toast.fire({
                    icon: 'error',
                    title: '网络错误，请稍后重试',
                });
            }
        };

        const startCountUp = (id, startValue) => {
            let count = new CountUp(id, startValue);
            if (!count.error) {
                count.start();
            } else {
                console.log(count.error);
            }
        }

        fetchData().then(data => {

            if (data.currentCount > data.originCount) {
                data.cleanCount = 0;
            }

            const counters = [
                {id: 'origin-count', startValue: data.originCount},
                {id: 'current-count', startValue: data.currentCount},
                {id: 'clean-count', startValue: data.cleanCount}
            ];

            counters.forEach(counter => {
                startCountUp(counter.id, counter.startValue);
            });

            const scuessStatus = document.getElementById('scuess-status');
            const failedStatus = document.getElementById('failed-status');
            failedStatus.classList.remove('d-none');
            scuessStatus.classList.remove('d-none');

            if (data.currentCount <= data.originCount && data.currentCount > 0) {
                scuessStatus.classList.remove('d-none');
                failedStatus.classList.add('d-none');
                document.getElementById('clean-btn').innerHTML = '重新清洗';
            } else {
                scuessStatus.classList.add('d-none');
                failedStatus.classList.remove('d-none');
                document.getElementById('clean-btn').innerHTML = '开始清洗';
            }
        });
    })();
</script>

<!-- job spider starter -->
<script>
    const jobCleaner = () => {
        var timerInterval = 0;
        const type = document.getElementById('data-source').value;
        const dataname = localStorage.getItem('dataname') == null ? '51job' : localStorage.getItem('dataname');

        const formData = new FormData();
        formData.append('type', type);
        formData.append('name', dataname);

        const fetchData = async () => {
            try {
                const url = `/api/clean`;
                const response = await fetch(url, {
                    method: 'PUT',
                    body: formData,
                });
                return await response.json();
            } catch (error) {
                Toast.fire({
                    icon: 'error',
                    title: '网络错误，请稍后重试',
                });
                Swal.close();
                clearInterval(timerInterval);
            }
        };

        Swal.fire({
            title: "数据清洗中",
            html: "已清洗<b></b>秒.",
            timerProgressBar: true,
            didOpen: () => {
                Swal.showLoading();
                const timer = Swal.getPopup().querySelector("b");
                clearInterval(timerInterval);
                let Interval = 0;
                timerInterval = setInterval(() => {
                    Interval++;
                    timer.textContent = Interval;
                }, 1000);
            },
            willClose: () => {
                timerInterval = 0;
                clearInterval(timerInterval);
            }
        });

        fetchData().then(result => {
            Swal.close();

            if (result.status === 1) {
                Toast.fire({
                    icon: 'success',
                    title: '清洗完成'
                });
                setTimeout(() => {
                    window.location.reload();
                }, 1000);
            }

            if (result.status === 0) {
                Toast.fire({
                    icon: 'error',
                    title: result.message,
                });
            }
            clearInterval(timerInterval);

        });
    };
</script>

<!-- Logout request -->
<script>
    const logout = () => {
        fetch('/api/logout', {
            method: 'POST',
        }).then(response => response.json())
            .then(data => {
                if (data.status === 1) {
                    Toast.fire({
                        icon: 'success',
                        title: data.message
                    });
                    window.location.href = window.location.origin;
                }
            }).catch(error => {
            Toast.fire({
                icon: 'error',
                title: '网络错误，请稍后重试'
            });
        });
    }
</script>
